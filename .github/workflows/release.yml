name: Release

# Tags a version, writes the changelog and cuts a GitHub release. It does not
# publish a package: this repository is private: true and there is no registry
# to publish a self-hosted console to. What a release means here is a tag
# somebody can check out and notes telling them what changed before they
# upgrade an instance holding their fleet's data.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Publish container images for a version that already has a tag, e.g.
          1.0.4 - for when the release was cut but an image job failed. Leave
          empty to attempt a release instead.
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: tag and release
    if: github.event_name == 'push' || inputs.version == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      # Empty when this push produced no release, which is the common case:
      # most pushes are chores that change no behaviour worth versioning.
      version: ${{ steps.released.outputs.version }}
      released: ${{ steps.released.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # semantic-release reads the whole history to work out what changed
          # since the last tag.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A release is a claim that this commit is fit to deploy, so it is
      # checked here rather than trusted from another workflow. Integration and
      # end-to-end suites need Postgres and a browser and already gate this
      # commit in CI; these are the ones worth repeating at the moment of
      # cutting a version.
      - name: Lint
        run: pnpm check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      # semantic-release writes .release-version only when it publishes, so
      # the file's absence is the signal that nothing was cut.
      - name: Record what was released
        id: released
        run: |
          if [ -f .release-version ]; then
            version="$(cat .release-version)"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Released ${version}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release for this push"
          fi

  # Separate from the release so a slow image build never delays the tag and
  # the notes. If this fails the version still exists and can be built again.
  #
  # One job per image per architecture, each on a runner of that architecture.
  # Emulating arm64 under QEMU hung `pnpm install` for 89 minutes and timed the
  # job out - twice - which is how v1.0.3 shipped a migrate image and no
  # console. Native runners build in minutes. Each job pushes its layers by
  # digest, without a tag; the manifest job below names the image once both
  # halves exist, so a tag never points at half a release.
  # Which version the image jobs publish: the one this push released, or the
  # one a dispatch named. Nothing, and they do not run.
  version:
    name: which version
    needs: release
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pick.outputs.version }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - name: Pick
        id: pick
        env:
          NAMED: ${{ inputs.version }}
          RELEASED: ${{ needs.release.outputs.released }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -n "$NAMED" ]; then
            version="$NAMED"
          elif [ "$RELEASED" = "true" ]; then
            version="$VERSION"
          else
            version=""
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing images for ${version}"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No version to publish images for"
          fi

  publish-image:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The compose stack runs both: the console, and the one-shot
          # container that applies migrations before it starts. Publishing
          # only the console would leave anyone deploying from the registry
          # still having to build half of it themselves.
          - { target: runner, image: codegate-guardian, arch: amd64, runner: ubuntu-24.04 }
          - { target: runner, image: codegate-guardian, arch: arm64, runner: ubuntu-24.04-arm }
          - { target: migrate, image: codegate-guardian-migrate, arch: amd64, runner: ubuntu-24.04 }
          - { target: migrate, image: codegate-guardian-migrate, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attached to the image in the registry, so what is deployed carries
          # its own bill of materials and a record of where it was built.
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Hand the digest to the manifest job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          # Named so one image's pattern cannot match another's: with plain
          # "digest-<image>-*", the console swept up the migrate image's digests
          # too and asked its own repository for them.
          name: ${{ matrix.image }}__digest__${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitches the per-architecture images into one tag per image, then writes
  # the SBOM a person can download from the release page.
  publish-manifest:
    name: publish ${{ matrix.image }}
    needs: [version, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: codegate-guardian }
          - { image: codegate-guardian-migrate }
    steps:
      - name: Collect the digests
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ${{ matrix.image }}__digest__*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # The moving tags move only when this push cut the release. A dispatch
          # that backfills an older version's images must not drag `latest`,
          # `1` or `1.0` back to it.
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # One "-t tag" per tag from the metadata step; one digest per file here.
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # The registry can take a few seconds to serve a digest that was
          # pushed moments ago by another job; the first release with this
          # layout failed on exactly that, two seconds after the last build.
          for attempt in 1 2 3 4 5 6; do
            # shellcheck disable=SC2046,SC2086
            if docker buildx imagetools create $tags \
                 $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *); then
              exit 0
            fi
            echo "attempt ${attempt} failed; waiting for the registry"
            sleep 10
          done
          exit 1

      - name: Inspect what was published
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.version }}

      # The registry attestation above is for tooling. This is the same thing
      # as a file a person can download from the release page and read.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}-${{ needs.version.outputs.version }}.spdx.json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Attach SBOM to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          mv sbom-${{ matrix.image }}.spdx.json \
             sbom-${{ matrix.image }}-${{ needs.version.outputs.version }}.spdx.json
          gh release upload "v${{ needs.version.outputs.version }}" \
            "sbom-${{ matrix.image }}-${{ needs.version.outputs.version }}.spdx.json" \
            --clobber
