name: codegate-guardian

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    image: codegate-guardian:local
    container_name: codegate-guardian-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET is required - generate one with 'openssl rand -base64 32'}"
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Agents present this to check in. Absent means ingest is closed.
      AGENT_INGEST_TOKEN: ${AGENT_INGEST_TOKEN:-}
      # Required to claim a fresh instance; see .env.example.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    ports:
      - "${APP_PORT:-3000}:3000"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    image: codegate-guardian-migrate:local
    container_name: codegate-guardian-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/postgres
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: codegate-guardian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # Loopback only. This database holds the fleet inventory and every
    # machine's token hash, and the compose credentials are the well-known
    # postgres/postgres — publishing it on 0.0.0.0 would put all of that on
    # the network. Use `docker compose exec postgres psql -U postgres` to
    # reach it, or change this to "5432:5432" if you really need a host port.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
