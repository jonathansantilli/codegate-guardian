name: CI

# Node 22 throughout: docker/Dockerfile builds on node:22-alpine, and CI
# testing a different runtime than the image ships is how a version-specific
# failure reaches production green.
on:
  push:
    branches: [main, master]
  pull_request:
  # So a run can be started by hand — needed the day this repository went
  # public, when every prior run had failed for want of Actions minutes and
  # there was nothing to push to prove it was fixed.
  workflow_dispatch:

# Least privilege for the whole workflow. Nothing here writes to the
# repository — CI reads the code, installs, and runs tests — so the token it
# gets should not be able to. Declared once at the top rather than per job,
# because a job added later inherits this rather than inheriting write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (type-check, lint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    needs: static-checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit

  integration-tests:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-22.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pre-pull test images
        run: |
          docker pull postgres:16-alpine
      - name: Run integration tests
        run: pnpm test:integration
        env:
          NODE_ENV: test

  e2e-smoke:
    name: E2E smoke subset
    runs-on: ubuntu-22.04
    needs: integration-tests
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # Same host port the compose stack uses, so a contributor copying
        # POSTGRES_URL from here gets one that works locally.
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-test-auth-secret-ci-test-auth-secret-ci
      POSTGRES_URL: postgresql://postgres:postgres@localhost:15432/postgres
      NEXT_PUBLIC_BASE_PATH: ""
      # Without this the ingest endpoint is closed, so the agent tests would
      # be asserting the wrong refusal.
      AGENT_INGEST_TOKEN: ci-agent-ingest-token-ci-agent-ingest-token
      # Pinned so a re-run against the same database can sign in rather than
      # trying to register an operator that already exists.
      E2E_OPERATOR_PASSWORD: ci-operator-password-ci-operator-password
      # The suite claims a fresh CI database as its first operator.
      SETUP_TOKEN: ci-setup-token-ci-setup-token-ci-setup-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (Chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Apply database migrations
        run: pnpm db:migrate
      # Playwright's webServer builds and starts the app; starting it here as
      # well is what made this job abort before any test ran.
      - name: Run E2E
        run: pnpm test:e2e

      # The suite runs against `next start`, which serves from .next/ — where
      # static assets always are. The image does NOT: docker/Dockerfile copies
      # .next/standalone and .next/static in as separate layers, and the
      # standalone bundle does not contain the latter. If those
      # COPY lines drift, or a Next upgrade changes what standalone includes,
      # every JS chunk 404s: pages still render, /ping still answers 200, and
      # nothing on the page works because React never hydrates. `next start`
      # cannot catch that, so this asserts it directly against the artefact
      # the image actually ships.
      - name: Smoke the standalone bundle the image ships
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          PORT=3001 node .next/standalone/server.js &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3001/ping >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3001/ping | grep -qx pong
          curl -fsS http://localhost:3001/login >/dev/null
          # The one assertion `next start` can never make: a real hashed chunk,
          # served from the copied-in static directory.
          chunk=$(ls .next/static/chunks | head -1)
          curl -fsS "http://localhost:3001/_next/static/chunks/$chunk" >/dev/null
          echo "standalone bundle serves its own static assets"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && !cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
