# Deliberately no `name:` and no `container_name:`. Compose derives the
# project from this directory, which is already codegate-guardian, and names
# containers under it — so a second checkout elsewhere gets its own set
# instead of taking over this one's. Pinning either made two copies of this
# repository fight over the same containers.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    image: codegate-guardian:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET is required - generate one with 'openssl rand -base64 32'}"
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      # Agents present this to check in. Absent means ingest is closed.
      AGENT_INGEST_TOKEN: ${AGENT_INGEST_TOKEN:-}
      # Required to claim a fresh instance; see .env.example.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    # Loopback by default. The window between `up` and an operator claiming
    # the instance is the one moment reaching the port is most of what stands
    # in the way, and defaulting to 0.0.0.0 means a laptop on shared wifi
    # publishes an unclaimed security console to the network.
    #
    # Agents on other machines do need to reach it, so exposing it is a real
    # requirement — just a deliberate one. Set APP_BIND=0.0.0.0 once you have
    # claimed the instance, and prefer a TLS-terminating reverse proxy in
    # front over publishing this container directly.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    image: codegate-guardian-migrate:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    # Loopback only, and deliberately not 5432. This database holds the fleet
    # inventory and every machine's token hash, and the compose credentials
    # are the well-known postgres/postgres — publishing that on 0.0.0.0 would
    # put all of it on the network.
    #
    # The host port is 15432 because 5432 is where everyone else's Postgres
    # already is: bringing this stack up beside another project should not be
    # a port conflict to debug. Inside the compose network it is still 5432,
    # which is what the app connects to. Override with POSTGRES_PORT.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
