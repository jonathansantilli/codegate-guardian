name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (type-check, lint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit

  integration-tests:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-22.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pre-pull test images
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
      - name: Run integration tests
        run: pnpm test:integration
        env:
          NODE_ENV: test

  e2e-smoke:
    name: E2E smoke subset
    runs-on: ubuntu-22.04
    needs: integration-tests
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-test-auth-secret-ci-test-auth-secret-ci
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_PUBLIC_BASE_PATH: ""
      # Without this the ingest endpoint is closed, so the agent tests would
      # be asserting the wrong refusal.
      AGENT_INGEST_TOKEN: ci-agent-ingest-token-ci-agent-ingest-token
      # Pinned so a re-run against the same database can sign in rather than
      # trying to register an operator that already exists.
      E2E_OPERATOR_PASSWORD: ci-operator-password-ci-operator-password
      # The suite claims a fresh CI database as its first operator.
      SETUP_TOKEN: ci-setup-token-ci-setup-token-ci-setup-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright (Chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Apply database migrations
        run: pnpm db:migrate
      # Playwright's webServer builds and starts the app; starting it here as
      # well is what made this job abort before any test ran.
      - name: Run E2E
        run: pnpm test:e2e

      # The suite runs against `next start`, which serves from .next/ — where
      # static assets always are. The image does NOT: docker/Dockerfile copies
      # .next/standalone, .next/static and public in as three separate layers,
      # and the standalone bundle contains neither of the last two. If those
      # COPY lines drift, or a Next upgrade changes what standalone includes,
      # every JS chunk 404s: pages still render, /ping still answers 200, and
      # nothing on the page works because React never hydrates. `next start`
      # cannot catch that, so this asserts it directly against the artefact
      # the image actually ships.
      - name: Smoke the standalone bundle the image ships
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3001 node .next/standalone/server.js &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3001/ping >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3001/ping | grep -qx pong
          curl -fsS http://localhost:3001/login >/dev/null
          # The one assertion `next start` can never make: a real hashed chunk,
          # served from the copied-in static directory.
          chunk=$(ls .next/static/chunks | head -1)
          curl -fsS "http://localhost:3001/_next/static/chunks/$chunk" >/dev/null
          echo "standalone bundle serves its own static assets"

      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
